<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can I ask you something?</title>
    
    <style>
        /* --- THIS IS THE DESIGN CODE --- */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffdde1; /* This makes the background PINK */
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        .header_text {
            font-size: 50px;
            font-weight: bold;
            color: #ff4d6d; /* Darker pink text */
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* Makes the buttons look like bubbles */
        .btn {
            background-color: #ff4d6d;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0; /* Prevents button from getting squished */
        }

        .yes-btn {
            background-color: #28a745; /* Green */
            z-index: 100;
        }

        .no-btn {
            background-color: #dc3545; /* Red */
        }

        .gif_container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gif_container">
            <img src="https://media.tenor.com/On7kNbOW9JYAAAAi/milk-and-mocha-bear-couple.gif" alt="Cute GIF">
        </div>

        <h1 class="header_text">Will you be my Valentine, Achu?</h1>
        
        <div class="buttons">
            <button class="btn yes-btn" onclick="nextPage()">Yes</button>
            <button class="btn no-btn" id="noBtn" onclick="moveButton()">No</button>
        </div>
    </div>

    <script>
        /* --- THIS IS THE LOGIC CODE --- */
        const messages = [
            "Are you sure?",
            "Really sure??",
            "Think of the snacks!",
            "I'll let you pick the movie...",
            "Don't break my heart ;(",
            "I'm going to cry...",
            "Please? :(",
            "Just say YES! ❤️"
        ];

        let messageIndex = 0;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.querySelector('.yes-btn');

            // Change text
            noBtn.innerText = messages[messageIndex];
            messageIndex = (messageIndex + 1) % messages.length;

            // Make Yes button bigger
            const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = `${currentSize * 1.5}px`;
            
            // Make it wider too so it doesn't look thin
            const currentPadding = parseFloat(window.getComputedStyle(yesBtn).padding);
            yesBtn.style.padding = `${currentPadding * 1.1}px`;
        }

        function nextPage() {
            window.location.href = "yes_page.html";
        }
    </script>
</body>
</html>
