<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can I ask you something?</title>
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffdde1;
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Important so hearts don't cause scrollbars */
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10; /* Keeps text ON TOP of hearts */
        }

        .header_text {
            font-size: 50px;
            font-weight: bold;
            color: #ff4d6d;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .yes-btn {
            background-color: #28a745;
            z-index: 100;
        }

        .no-btn {
            background-color: #dc3545;
        }

        .gif_container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* --- NEW HEART STYLES --- */
        .heart {
            position: fixed;
            color: #ff4d6d;
            font-size: 20px;
            bottom: -10vh; /* Start below screen */
            animation: float-up linear forwards;
            opacity: 0.6; /* Slightly see-through */
            z-index: 1; /* Behind the text */
        }

        @keyframes float-up {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh); /* Float to top */
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gif_container">
            <img src="https://media.tenor.com/On7kNbOW9JYAAAAi/milk-and-mocha-bear-couple.gif" alt="Cute GIF">
        </div>

        <h1 class="header_text">Will you be my Valentine, Achu?</h1>
        
        <div class="buttons">
            <button class="btn yes-btn" onclick="nextPage()">Yes</button>
            <button class="btn no-btn" id="noBtn" onclick="moveButton()">No</button>
        </div>
    </div>

    <script>
        /* LOGIC CODE */
        const messages = [
            "Are you sure?",
            "Really sure??",
            "Think of the snacks!",
            "I'll let you pick the movie...",
            "Don't break my heart ;(",
            "I'm going to cry...",
            "Please? :(",
            "Just say YES! ❤️"
        ];

        let messageIndex = 0;

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.querySelector('.yes-btn');

            noBtn.innerText = messages[messageIndex];
            messageIndex = (messageIndex + 1) % messages.length;

            const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = `${currentSize * 1.5}px`;
            
            const currentPadding = parseFloat(window.getComputedStyle(yesBtn).padding);
            yesBtn.style.padding = `${currentPadding * 1.1}px`;
        }

        function nextPage() {
            window.location.href = "yes_page.html";
        }

        /* --- NEW FLOATING HEARTS FUNCTION --- */
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️'; // You can change this to 💖 or 🧸
            
            // Random position and size
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's'; // 2-5 seconds speed
            heart.style.fontSize = Math.random() * 20 + 10 + 'px'; // Random size
            
            document.body.appendChild(heart);

            // Remove heart after it floats away to keep site fast
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Create a new heart every 300 milliseconds
        setInterval(createHeart, 300);
    </script>
</body>
</html>
